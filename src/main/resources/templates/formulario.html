<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - SSR com Thymeleaf</title>
</head>
<body>
    <div class="container">
        <h1>SSR com Thymeleaf</h1>
        <p th:text="${mensagem}"></p>
        
        <form method="GET" action="/saudacao">
            <label for="nome">Nome:</label>
            <input 
                type="text" 
                id="nome" 
                name="nome" 
                placeholder="Digite seu nome..."
                required
            >
            <button type="submit">Enviar</button>
        </form>
        
        <div class="info">
            <strong>O que é SSR?</strong><br>
            Server-Side Rendering (SSR) renderiza a página HTML no servidor antes de enviar para o navegador. 
            Thymeleaf é um template engine que permite substituir valores no HTML usando sintaxe especial.
        </div>
        
        <a href="/">← Voltar para o início</a>
    </div>
</body>
</html>
